*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1.5px 1.5px at 5% 8%,rgba(255,255,255,0.9),transparent),
    radial-gradient(2px 2px at 14% 55%,rgba(255,200,100,0.8),transparent),

    radial-gradient(2px 2px at 41% 38%,rgba(255,255,255,0.85),transparent),
    radial-gradient(1px 1px at 50% 62%,rgba(255,230,150,0.7),transparent),
    radial-gradient(1.5px 1.5px at 58% 12%,rgba(180,255,180,0.7),transparent),
    radial-gradient(1px 1px at 66% 88%,rgba(255,180,255,0.65),transparent),
    radial-gradient(2px 2px at 74% 32%,rgba(255,255,255,0.75),transparent),
    radial-gradient(1px 1px at 82% 68%,rgba(255,220,100,0.65),transparent),
    radial-gradient(1.5px 1.5px at 90% 15%,rgba(255,255,255,0.9),transparent),

  animation:starsTwinkle 3.5s ease-in-out infinite alternate;
}
@keyframes starsTwinkle{0%{opacity:0.5;}50%{opacity:1;}100%{opacity:0.65;}}

.balloon{position:fixed;bottom:-120px;pointer-events:none;animation:balloonRise linear infinite;z-index:10;}
@media(max-height:500px){.hero-icon,.hero-stats,.modal-sub{display:none;}.modal-hero{padding:6px 16px;}}
.reset-btn{align-self:center;margin:14px 0 0;min-height:44px;min-width:44px;background:none;border:1px solid rgba(255,255,255,0.35);color:rgba(255,255,255,0.85);border-radius:20px;padding:6px 14px;font:700 12px 'Nunito',sans-serif;cursor:pointer;flex-shrink:0;}
.reset-btn:focus-visible{outline:2px solid #ffd700;outline-offset:2px;}
.reset-btn[hidden]{display:none;}
@media(max-width:600px){.balloon:nth-of-type(n+4),.confetti-piece{display:none;}}
@media(max-width:360px){.balloon{display:none;}}
@keyframes balloonRise{
  0%  {transform:translateY(0) translateX(0px) rotate(-3deg);opacity:0;}
  5%  {opacity:1;}
  50% {transform:translateY(-55vh) translateX(18px) rotate(3deg);}
  85% {opacity:0.7;}
  100%{transform:translateY(-115vh) translateX(-10px) rotate(-2deg);opacity:0;}
}

.confetti-piece{position:fixed;top:-10px;width:8px;height:8px;opacity:0;pointer-events:none;animation:confettiFall linear infinite;}
@keyframes confettiFall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:0;}
  10%{opacity:0.9;}
  90%{opacity:0.3;}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0;}
}

.modal-wrap{
  position:relative;z-index:1;
  width:min(98vw,1100px);
  height:100%;max-height:100%;
  display:flex;flex-direction:column;
  isolation:isolate;
}
.card{
  background:linear-gradient(155deg,#1a0828,#0e0520);
  border-radius:clamp(12px,1.5vw,24px);overflow:hidden;
  display:flex;flex-direction:column;
  flex:1 1 0;min-height:0;overflow:clip;
  box-shadow:
    0 0 0 3px #ff6b35, 0 0 0 6px #ffd700, 10px 10px 0 rgba(0,0,0,0.45), 0 0 60px rgba(255,107,53,0.25),
    0 0 50px rgba(100,80,255,0.15),
    0 0 30px rgba(255,200,0,0.10),
    inset 0 1px 0 rgba(255,255,255,0.07);
}

.modal-hero{
  background:linear-gradient(160deg,#1f0635,#120428);
  padding:min(2vh,20px) min(2.5vw,36px) min(1.4vh,14px);
  text-align:center;position:relative;overflow:hidden;
  flex-shrink:0;
}
.modal-hero::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 30% 30%,rgba(255,107,53,0.18),transparent 60%),
    radial-gradient(ellipse at 75% 70%,rgba(80,100,255,0.18),transparent 55%),
    radial-gradient(ellipse at 55% 10%,rgba(255,200,0,0.12),transparent 45%),
    radial-gradient(ellipse at 20% 80%,rgba(0,200,150,0.10),transparent 50%);
}
.modal-hero::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 20%,rgba(255,200,255,0.7),transparent),
    radial-gradient(1px 1px at 30% 60%,rgba(255,230,100,0.6),transparent),
    radial-gradient(2px 2px at 50% 12%,rgba(255,255,255,0.75),transparent),
    radial-gradient(1px 1px at 70% 40%,rgba(150,200,255,0.6),transparent),
    radial-gradient(1.5px 1.5px at 88% 18%,rgba(255,180,255,0.7),transparent);
  animation:starsTwinkle 3.5s ease-in-out infinite alternate;
}

.hero-icon{
  position:relative;z-index:1;
  font-size:min(6vw,6vh,54px);line-height:1;
  margin:0 auto min(0.5vh,6px);
  animation:heroPulse 2.5s ease-in-out infinite;
  filter:drop-shadow(0 0 14px rgba(255,107,53,0.55));
}
@keyframes heroPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}

.modal-title{
  font-family:'Fredoka',sans-serif;font-weight:600;
  font-size:clamp(24px,min(3.2vw,4.5vh),42px);
  background:linear-gradient(90deg,#ff6b35,#ffd700,#7ee8ff,#ff6b35);
  background-size:300% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:titleShimmer 4s linear infinite;
  margin-bottom:2px;position:relative;z-index:1;line-height:1.15;
}
@keyframes titleShimmer{0%{background-position:0% center;}100%{background-position:300% center;}}

.modal-sub{
  color:#FFD700;font-size:clamp(12px,min(1vw,1.4vh),13px);
  font-weight:700;letter-spacing:1.3px;text-transform:uppercase;
  margin-bottom:min(0.9vh,9px);position:relative;z-index:1;
  opacity:0.85;
}

.hero-stats{
  display:flex;align-items:center;justify-content:center;
  gap:clamp(4px,0.8vw,12px);flex-wrap:wrap;
  margin-bottom:min(0.3vh,4px);position:relative;z-index:1;
}
.stat-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:linear-gradient(135deg,rgba(255,215,0,0.18),rgba(255,180,0,0.10));
  border:1.5px solid rgba(255,215,0,0.60);
  border-radius:20px;padding:clamp(2px,0.4vh,6px) clamp(6px,0.8vw,14px);
  font-family:'Fredoka',sans-serif;font-weight:600;
  font-size:clamp(12px,min(0.9vw,1.3vh),13px);color:#FFD700;
  letter-spacing:0.3px;white-space:nowrap;
  box-shadow:0 0 10px rgba(255,215,0,0.12);
}

.games-section{
  padding:min(1vh,10px) min(1.8vw,24px) clamp(96px,16vh,120px);
  flex:1 1 0;min-height:0;
  display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,107,53,0.45) transparent;
}
.games-section::-webkit-scrollbar{width:5px;}
.games-section::-webkit-scrollbar-track{background:transparent;}
.games-section::-webkit-scrollbar-thumb{background:rgba(255,107,53,0.45);border-radius:10px;}
.games-section::-webkit-scrollbar-thumb:hover{background:rgba(255,215,0,0.55);}

.section-divider{
  font-family:'Fredoka',sans-serif;font-weight:600;color:#FFD700;
  font-size:clamp(12px,min(0.9vw,1.2vh),13px);letter-spacing:1.4px;text-transform:uppercase;
  margin:min(1.1vh,11px) 0 min(0.7vh,7px);
  display:flex;align-items:center;gap:8px;
  flex-shrink:0;
}
.section-divider:first-child{margin-top:min(0.4vh,4px);}
.section-divider::after{
  content:'🌟 🌟 🌟';flex:1;
  font-size:8px;letter-spacing:4px;
  color:rgba(255,215,0,0.25);
  text-align:center;overflow:hidden;
  display:flex;align-items:center;
  padding-left:6px;
}
.section-count{
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:12px;letter-spacing:1px;
  background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.40);
  border-radius:20px;padding:2px 8px;color:#FFD700;white-space:nowrap;
}

.games-grid{display:grid;gap:clamp(7px,0.9vw,14px);flex-shrink:0;}
.games-grid-1{grid-template-columns:1fr;}
.games-grid-2{grid-template-columns:repeat(2,1fr);}

@media(max-width:480px){
  .games-grid-2{grid-template-columns:1fr;}
}

.game-card{
  background:linear-gradient(145deg,#2a0a4e,#1a0835,#0f0525);
  border:none;
  border-radius:clamp(10px,1.1vw,15px);
  padding:clamp(8px,min(1vw,1.2vh),14px) clamp(10px,1.1vw,16px);
  text-align:left;cursor:pointer;text-decoration:none;
  display:flex;flex-direction:row;align-items:center;gap:clamp(8px,1.2vw,16px);
  transition:transform 0.22s cubic-bezier(.34,1.56,.64,1),box-shadow 0.2s;
  position:relative;overflow:hidden;
  touch-action:manipulation;
  box-shadow:
    0 0 0 2px var(--gc,#ff6b35),
    0 0 0 4px #ffd700,
    4px 4px 0 rgba(0,0,0,0.40),
    0 0 14px var(--gc-glow, rgba(255,107,53,0.18));
}
.game-card::before{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--gc);opacity:0.05;transition:opacity 0.2s;pointer-events:none;}
@media(hover:hover){
.game-card:hover{transform:translateY(-3px) scale(1.015);box-shadow:0 0 0 2px var(--gc,#ff6b35),0 0 0 4px #ffd700,4px 4px 0 rgba(0,0,0,0.40),0 0 24px var(--gc-glow);}
.game-card:hover::before{opacity:0.13;}
.game-card:hover .game-icon-tile{transform:scale(1.12) rotate(-4deg);}
}
.game-card.played .game-name::after{content:' ✓';color:#7ee8a8;}
.game-card:focus-visible{outline:2px solid #ffd700;outline-offset:3px;}

.game-icon-tile{
  flex-shrink:0;
  width:clamp(48px,6.5vw,72px);height:clamp(48px,6.5vw,72px);
  border-radius:clamp(9px,1vw,14px);
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(22px,min(2.6vw,3.4vh),36px);line-height:1;
  background:linear-gradient(145deg, var(--gc), #1a0835);
  box-shadow:inset 0 2px 6px rgba(255,255,255,0.20), inset 0 -5px 10px rgba(0,0,0,0.35);
  filter:drop-shadow(0 3px 6px rgba(0,0,0,0.35));
  transition:transform 0.22s cubic-bezier(.34,1.56,.64,1);
}

.game-info{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
.game-name{
  font-family:'Fredoka',sans-serif;font-weight:600;
  font-size:clamp(14px,min(1.1vw,1.5vh),17px);color:#fff;line-height:1.2;
}
.game-desc{
  font-size:clamp(12px,min(0.85vw,1.1vh),13px);color:rgba(255,255,255,0.70);
  font-family:'Nunito',sans-serif;font-weight:700;line-height:1.32;
}
.game-tag{
  align-self:flex-start;
  display:inline-block;background:var(--gc);color:#12041f;
  font-size:12px;font-weight:700;letter-spacing:0.4px;
  padding:2px 8px;border-radius:20px;box-shadow:0 2px 8px var(--gc-glow);margin-top:2px;
}

.games-grid-1 .game-card{padding:clamp(10px,1.3vw,18px) clamp(12px,1.6vw,22px);}
.games-grid-1 .game-icon-tile{width:clamp(56px,8vw,88px);height:clamp(56px,8vw,88px);font-size:clamp(28px,min(3.2vw,4.2vh),44px);}
.games-grid-1 .game-name{font-size:clamp(16px,min(1.4vw,1.9vh),21px);}
.games-grid-1 .game-desc{font-size:clamp(12.5px,min(0.95vw,1.2vh),14px);}

@media(max-width:400px){
  .game-card{flex-direction:column;text-align:center;padding:12px;}
  .game-info{align-items:center;}
  .game-tag{align-self:center;}
}

#fixed-robot-wrap{
  position:absolute;
  bottom:calc(.5rem + env(safe-area-inset-bottom,0px));
  right:calc(.5rem + env(safe-area-inset-right,0px));
  z-index:600;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  pointer-events:auto;
}
#fixed-bubble{
  --bc:#dcebff;
  background:linear-gradient(135deg,var(--bc),#fff);
  border:3px solid #0f172a;outline:2px solid #1e293b;outline-offset:-4px;
  border-radius:16px;padding:6px 10px 5px;
  box-shadow:3px 3px 0 #0f172a;
  font-family:"Comic Sans MS","Trebuchet MS",sans-serif;
  font-size:clamp(.62rem,1.5vw,.78rem);font-weight:bold;color:#0f172a;
  max-width:180px;min-width:80px;text-align:center;
  pointer-events:none;position:relative;
  opacity:0;transform:translateY(-6px) scale(.88);
  transition:opacity .38s,transform .38s cubic-bezier(.34,1.56,.64,1);
  margin-bottom:4px;
}
#fixed-bubble::after{content:"";position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);border-left:10px solid transparent;border-right:10px solid transparent;border-top:14px solid #0f172a;}
#fixed-bubble::before{content:"";position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid var(--bc);z-index:1;}
#fixed-bubble.show{opacity:1;transform:translateY(0) scale(1);}
#fixed-vb-robot{
  width:clamp(60px,8vw,88px);height:auto;display:block;cursor:pointer;
  animation:vbFloat 3s ease-in-out infinite;
  filter:drop-shadow(0 0 12px #7dd3fc);
}
#fixed-vb-robot:focus-visible{outline:3px solid #ffd700;outline-offset:4px;border-radius:12px;}
#fixed-vb-robot:hover{filter:drop-shadow(0 0 24px #38bdf8);}
#fixed-vb-robot.bounce{animation:robotPop .65s cubic-bezier(.34,1.56,.64,1),vbFloat 3s ease-in-out .65s infinite;}
@keyframes vbFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
@keyframes robotPop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-18px) rotate(-6deg)}70%{transform:translateY(-8px) rotate(5deg)}}
#fixed-robot-name{
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(.58rem,1.3vw,.7rem);
  color:#ffa733;text-shadow:0 1px 6px rgba(0,0,0,.8),0 0 10px rgba(236,30,121,.4);
  text-align:center;line-height:1.2;
}
@media(max-width:480px){#fixed-robot-wrap{bottom:calc(.45rem + env(safe-area-inset-bottom,0px));right:calc(.45rem + env(safe-area-inset-right,0px));}#fixed-vb-robot{width:54px;}#fixed-bubble{max-width:150px;font-size:.7rem;}}

#prof-tag{
  position:absolute;left:calc(1.1rem + env(safe-area-inset-left,0px));bottom:calc(.6rem + env(safe-area-inset-bottom,0px));
  z-index:50;font-size:12px;color:rgba(255,255,255,0.8);pointer-events:none;
  background:rgba(10,4,25,0.55);
  padding:3px 10px;border-radius:20px;
  border:1px solid rgba(255,255,255,0.10);
}
</style>

function esc(x){return x.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function getPlayed(){try{return JSON.parse(localStorage.getItem('vb-played')||'[]');}catch(e){return [];}}
function markPlayed(id){try{const p=getPlayed();if(p.indexOf(id)<0){p.push(id);localStorage.setItem('vb-played',JSON.stringify(p));}}catch(e){}}
(function renderGames(){
  const played=getPlayed();let total=0;
  document.getElementById('games').innerHTML=SECTIONS.map(function(sec){
    total+=sec.g.length;
    return '<h2 class="section-divider">'+esc(sec.t)+' <span class="section-count">'+sec.g.length+(sec.g.length===1?' jogo':' jogos')+'</span></h2>'+
    '<div class="games-grid '+(sec.g.length===1?'games-grid-1':'games-grid-2')+'">'+sec.g.map(function(g){
      const url=g.u||(BASE+g.p+'/');

    }).join('')+'</div>';

  document.getElementById('total-a').textContent=total;document.getElementById('total-b').textContent=total;
  const box=document.getElementById('games');
  const btn=document.createElement('button');btn.type='button';btn.className='reset-btn';btn.textContent='↺ Recomeçar (limpar os ✓)';box.appendChild(btn);
  function refresh(){const p=getPlayed();box.querySelectorAll('.game-card').forEach(function(a){a.classList.toggle('played',p.indexOf(a.dataset.id)>=0);});btn.hidden=!p.length;}
  box.addEventListener('click',function(e){const a=e.target.closest('.game-card');if(a)markPlayed(a.dataset.id);});
  btn.addEventListener('click',function(){try{localStorage.removeItem('vb-played');}catch(e){}refresh();});
  window.addEventListener('pageshow',refresh);refresh();
  const root=document.documentElement,pb=document.createElement('button');pb.type='button';pb.className='reset-btn';box.appendChild(pb);
  function setAnim(off,save){root.classList.toggle('no-anim',off);pb.setAttribute('aria-pressed',off);pb.textContent=off?'▶ Ativar animações':'⏸ Pausar animações';if(save){try{localStorage.setItem('vb-anim',off?'off':'on');}catch(e){}}}
  let saved=null;try{saved=localStorage.getItem('vb-anim');}catch(e){}
  setAnim(saved==='off',false);pb.addEventListener('click',function(){setAnim(!root.classList.contains('no-anim'),true);});
})();
function rrVan(ctx,x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath();
}
function cfVan(ctx,x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}

function drawVanBerto(ctx,blink,step,armsUp){
  const w=96,h=96;
  ctx.clearRect(0,0,w,h);
  ctx.lineJoin="round"; ctx.lineCap="round";
  ctx.save(); ctx.translate(0,6);
  const NAVY="#16233e", NAVY2="#26365a", OUT="#101a30";
  function white(x0,y0,x1,y1){const g=ctx.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,"#ffffff");g.addColorStop(0.55,"#e6edf7");g.addColorStop(1,"#b4c4dc");return g;}

  const LIFT=8, STRIDE=3;
  let lTop=70, rTop=70, lDX=0, rDX=0;
  if(step===0){ lTop=70-LIFT; lDX=STRIDE; rDX=-STRIDE; }
  else if(step===1){ rTop=70-LIFT; rDX=STRIDE; lDX=-STRIDE; }
  function leg(cx,top){
    rrVan(ctx,cx-5,top,10,11,4.5); ctx.fillStyle=white(cx-5,top,cx+5,top); ctx.fill();
    ctx.lineWidth=2.6; ctx.strokeStyle=OUT; ctx.stroke();
    const fy=top+9;
    rrVan(ctx,cx-6.5,fy,13,9,4); ctx.fillStyle=NAVY; ctx.fill();
    ctx.lineWidth=2.6; ctx.strokeStyle=OUT; ctx.stroke();
    rrVan(ctx,cx-6.5,fy+2,13,2.4,1.2); ctx.fillStyle="rgba(255,255,255,0.85)"; ctx.fill();
    cfVan(ctx,cx-2.5,fy+4.5,1.4,"rgba(255,255,255,0.5)");
  }
  leg(41+lDX,lTop); leg(55+rDX,rTop);

  const ARM_SWING = 0.24;
  const JUMP_RAISE = 2.9;
  let lArmSwing = 0, rArmSwing = 0;
  if(armsUp){ lArmSwing = JUMP_RAISE; rArmSwing = -JUMP_RAISE; }
  else if(step===0){ lArmSwing=-ARM_SWING; rArmSwing=ARM_SWING; }
  else if(step===1){ lArmSwing=ARM_SWING; rArmSwing=-ARM_SWING; }
  function arm(sx,swing){
    ctx.save();
    const px=sx+4.5, py=52;
    ctx.translate(px,py); ctx.rotate(swing); ctx.translate(-px,-py);
    rrVan(ctx,sx,52,9,13,4.5); ctx.fillStyle=white(sx,52,sx+9,52); ctx.fill();
    ctx.lineWidth=2.6; ctx.strokeStyle=OUT; ctx.stroke();
    const hx=sx+4.5, hy=67;
    cfVan(ctx,hx,hy,5,NAVY);
    ctx.lineWidth=2.3; ctx.strokeStyle=OUT; ctx.beginPath(); ctx.arc(hx,hy,5,0,Math.PI*2); ctx.stroke();
    cfVan(ctx,hx-2,hy+1.6,1.4,NAVY2); cfVan(ctx,hx+0.5,hy+2.4,1.4,NAVY2); cfVan(ctx,hx+2.5,hy+1.6,1.4,NAVY2);
    ctx.restore();
  }
  arm(17,lArmSwing); arm(70,rArmSwing);

  rrVan(ctx,26,44,44,32,15); ctx.fillStyle=white(28,46,68,46); ctx.fill();
  ctx.save(); rrVan(ctx,26,44,44,32,15); ctx.clip();
  const wg=ctx.createLinearGradient(0,64,0,76); wg.addColorStop(0,"rgba(22,35,62,0)"); wg.addColorStop(0.4,"#1c2c4c"); wg.addColorStop(1,"#142038");
  ctx.fillStyle=wg; ctx.fillRect(26,62,44,16);
  ctx.strokeStyle="rgba(16,26,48,0.6)"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(28,64); ctx.lineTo(68,64); ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,0.5)"; ctx.beginPath(); ctx.ellipse(36,52,9,5.5,-0.5,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.lineWidth=3; ctx.strokeStyle=OUT; rrVan(ctx,26,44,44,32,15); ctx.stroke();

  cfVan(ctx,48,56,8,NAVY);
  ctx.lineWidth=2.5; ctx.strokeStyle=OUT; ctx.beginPath(); ctx.arc(48,56,8,0,Math.PI*2); ctx.stroke();
  const dome=ctx.createRadialGradient(45.5,53.5,1,48,56,7); dome.addColorStop(0,"#aebccf"); dome.addColorStop(0.6,"#5a6a85"); dome.addColorStop(1,"#2b3a57");
  ctx.fillStyle=dome; ctx.beginPath(); ctx.arc(48,56,5.7,0,Math.PI*2); ctx.fill();
  cfVan(ctx,46,53.8,1.5,"rgba(255,255,255,0.85)");

  function pod(cx){
    cfVan(ctx,cx,32,6,NAVY);
    ctx.lineWidth=2.3; ctx.strokeStyle=OUT; ctx.beginPath(); ctx.arc(cx,32,6,0,Math.PI*2); ctx.stroke();
    cfVan(ctx,cx,32,2.8,NAVY2); cfVan(ctx,cx-0.8,31,1,"rgba(255,255,255,0.6)");
  }
  pod(25); pod(71);

  ctx.fillStyle=NAVY; ctx.beginPath(); ctx.moveTo(45,16); ctx.lineTo(51,16); ctx.lineTo(49.2,8); ctx.lineTo(46.8,8); ctx.closePath(); ctx.fill();
  const halo=ctx.createRadialGradient(48,5,1,48,5,11); halo.addColorStop(0,"rgba(90,200,255,0.55)"); halo.addColorStop(1,"rgba(90,200,255,0)");
  ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(48,5,11,0,Math.PI*2); ctx.fill();
  const bg=ctx.createRadialGradient(46.3,3.5,0.5,48,5,5.5); bg.addColorStop(0,"#e6f7ff"); bg.addColorStop(0.4,"#48b4ff"); bg.addColorStop(1,"#1670d8");
  ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(48,5,5.5,0,Math.PI*2); ctx.fill();
  cfVan(ctx,46.2,3.4,1.6,"#ffffff");

  rrVan(ctx,26,14,44,34,17); ctx.fillStyle=white(28,15,68,15); ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle=OUT; ctx.stroke();
  ctx.save(); rrVan(ctx,26,14,44,34,17); ctx.clip();
  ctx.fillStyle="rgba(255,255,255,0.6)"; ctx.beginPath(); ctx.ellipse(38,19,10,4,-0.5,0,Math.PI*2); ctx.fill(); ctx.restore();

  rrVan(ctx,30,20,36,23,12); ctx.fillStyle=NAVY; ctx.fill();
  rrVan(ctx,32.5,22,31,19,10);
  const vg=ctx.createLinearGradient(0,22,0,41); vg.addColorStop(0,"#7fd4ff"); vg.addColorStop(0.5,"#2a9bf0"); vg.addColorStop(1,"#1366c6");
  ctx.fillStyle=vg; ctx.fill();
  ctx.save(); rrVan(ctx,32.5,22,31,19,10); ctx.clip();
  ctx.fillStyle="rgba(255,255,255,0.45)"; ctx.beginPath(); ctx.ellipse(42,25,9,3.5,-0.4,0,Math.PI*2); ctx.fill(); ctx.restore();

  if(!blink){
    ctx.fillStyle="#0a0f1c";
    ctx.beginPath(); ctx.ellipse(41,30,3.3,4,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(55,30,3.3,4,0,0,Math.PI*2); ctx.fill();
    cfVan(ctx,42.3,28.4,1.5,"#fff"); cfVan(ctx,39.9,31,0.8,"#fff");
    cfVan(ctx,56.3,28.4,1.5,"#fff"); cfVan(ctx,53.9,31,0.8,"#fff");
  } else if(blink==="wink"){
    ctx.fillStyle="#0a0f1c";
    ctx.beginPath(); ctx.ellipse(41,30,3.3,4,0,0,Math.PI*2); ctx.fill();
    cfVan(ctx,42.3,28.4,1.5,"#fff"); cfVan(ctx,39.9,31,0.8,"#fff");
    ctx.lineWidth=3; ctx.strokeStyle="#0a0f1c"; ctx.lineCap="round";
    ctx.beginPath(); ctx.arc(55,31,3.5,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  } else if(blink==="happy"){
    ctx.lineWidth=3.2; ctx.strokeStyle="#0a0f1c"; ctx.lineCap="round";
    ctx.beginPath(); ctx.arc(41,31,3.9,0.10*Math.PI,0.90*Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(55,31,3.9,0.10*Math.PI,0.90*Math.PI); ctx.stroke();
    cfVan(ctx,33.5,35.5,3,"rgba(255,120,120,0.55)");
    cfVan(ctx,62.5,35.5,3,"rgba(255,120,120,0.55)");
  } else if(blink==="sad"){
    ctx.strokeStyle="#0a0f1c"; ctx.lineWidth=2.3; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(37,24); ctx.lineTo(44.5,27); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(59,24); ctx.lineTo(51.5,27); ctx.stroke();
    ctx.fillStyle="#0a0f1c";
    ctx.beginPath(); ctx.ellipse(41,32,2.8,3.1,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(55,32,2.8,3.1,0,0,Math.PI*2); ctx.fill();
    cfVan(ctx,42,30.7,1.1,"#fff"); cfVan(ctx,56,30.7,1.1,"#fff");
    ctx.fillStyle="#6fd0ff";
    ctx.beginPath();
    ctx.moveTo(56,35); ctx.quadraticCurveTo(59,40,56,43.5); ctx.quadraticCurveTo(53,40,56,35);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.lineWidth=3; ctx.strokeStyle="#0a0f1c";
    ctx.beginPath(); ctx.arc(41,31,3.5,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(55,31,3.5,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  }
  ctx.fillStyle="#0a0f1c";
  if(blink==="wink"){
    ctx.beginPath(); ctx.ellipse(48,36,5.6,3.6,0,0,Math.PI); ctx.fill();
    ctx.fillStyle="#ff7a7a";
    ctx.beginPath(); ctx.ellipse(48,37.6,2.9,1.7,0,0,Math.PI); ctx.fill();
  } else if(blink==="happy"){
    ctx.beginPath(); ctx.ellipse(48,36,6.2,4.2,0,0,Math.PI); ctx.fill();
    ctx.fillStyle="#ff7a7a";
    ctx.beginPath(); ctx.ellipse(48,38,3.2,1.9,0,0,Math.PI); ctx.fill();
  } else if(blink==="sad"){
    ctx.strokeStyle="#0a0f1c"; ctx.lineWidth=2.4; ctx.lineCap="round";
    ctx.beginPath(); ctx.arc(48,40,4.2,Math.PI,Math.PI*2); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.ellipse(48,36,4.6,3.2,0,0,Math.PI); ctx.fill();
    ctx.fillStyle="#ff7a7a";
    ctx.beginPath(); ctx.ellipse(48,37.4,2.4,1.5,0,0,Math.PI); ctx.fill();
  }
  ctx.restore();
}

const vbCtx=vbRobot.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,3);
vbRobot.width=96*DPR;vbRobot.height=96*DPR;vbCtx.scale(DPR,DPR);
const REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let vbBusy=false;

function vbSetFrame(blink,step,armsUp){ drawVanBerto(vbCtx,blink,step,armsUp); }
vbSetFrame(false,-1,false);

function vbBlink(){
  if(vbBusy)return;
  vbSetFrame(true,-1,false);
  setTimeout(()=>{ if(!vbBusy) vbSetFrame(false,-1,false); },180);
}

function vbWalk(steps,speed){
  steps=steps||6; speed=speed||170;
  if(vbBusy)return;
  vbBusy=true;
  let i=0;
  const iv=setInterval(()=>{
    vbSetFrame(false, i%2===0?0:1, false);
    i++;
    if(i>=steps){
      clearInterval(iv);
      vbSetFrame(false,-1,false);
      vbBusy=false;
    }
  },speed);
}

function vbJump(){
  if(vbBusy)return;
  vbBusy=true;
  vbRobot.classList.remove('bounce');void vbRobot.offsetWidth;vbRobot.classList.add('bounce');
  vbSetFrame('happy',-1,true);
  setTimeout(()=>{
    vbSetFrame(false,-1,false);
    vbBusy=false;
  },700);
}

setInterval(()=>{
  if(vbBusy||document.hidden||REDUCED||document.documentElement.classList.contains('no-anim'))return;
  const r=Math.random();
  if(r<0.18)vbJump();
  else if(r<0.5)vbWalk();
  else vbBlink();
},3600);

vbRobot.addEventListener('click',()=>{
  vbJump();
  showBub(MSGS[Math.floor(Math.random()*MSGS.length)]);
});
vbRobot.addEventListener('keydown',function(e){
  if(e.key==='Enter'||e.key===' '){
    vbJump();
    showBub(MSGS[Math.floor(Math.random()*MSGS.length)]);
  }
});

setTimeout(function(){showBub('Olá! Sou o VanBerto\'s! Escolhe a tua missão! 🛡️');},900);
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
